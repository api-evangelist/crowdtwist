summary: >-
  CrowdTwist publishes a hard API request ceiling — but in its contract document, not in its
  developer documentation. The Oracle CrowdTwist Cloud Service Service Descriptions states a
  maximum of 10,000 API requests per minute per program instance, as a Usage Limit alongside the
  Active Member count. The Developer Help Center never mentions it, never names a 429, and
  documents no rate-limit response headers at all, so an agent has the number but no runtime
  signal to back off on.
