currency:
  last_updated: '2021-10-19'
  age_note: >-
    Oracle's own Starter Kit page states the collection was last updated 2021-10-19. The
    platform has shipped monthly releases continuously since (see changelog/), so the
    collection covers 14 of the ~36 REST operations documented in the Developer Help
    Center and does not include badges, leaderboard, points expiration, redemption
    history v2.2, user delete or the v2.1 rewards/activities catalogs.
