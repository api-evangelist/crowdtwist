name: Oracle CrowdTwist Starter Kit Postman Collection
description: >-
  Oracle publishes a first-party Postman collection ("CrowdTwist Starter Kit") for the
  CrowdTwist Loyalty and Engagement REST API as a downloadable ZIP from the CrowdTwist
  Developer Help Center. It is the only machine-readable contract Oracle publishes for
  this API — there is no OpenAPI, Swagger, GraphQL or AsyncAPI document anywhere on the
  crowdtwist.com or docs.oracle.com surface (see well-known/crowdtwist-well-known.yml
  and the probe log below). Both files are saved here verbatim, exactly as they were
  extracted from Oracle's ZIP.
