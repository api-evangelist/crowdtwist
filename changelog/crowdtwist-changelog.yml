  highlights:
  - Opt-in support for Activity Campaigns (previously Commerce Campaigns only).
  - Frequency capping for Activity Campaigns.
  - Xstore Plug-in v2 — points redemption at point of sale, customer-facing marketing messages, custom receipt trailers.
  - Rewards in active use by a widget can now be disabled without removing them from the widget config.
  - Segment dashboard filter added to Control Center reporting.
