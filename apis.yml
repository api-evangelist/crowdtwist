name: CrowdTwist
description: >-
  CrowdTwist is a customer loyalty and engagement platform founded in New York
  City in 2009 and accelerated through Techstars. It lets consumer brands build
  multi-channel loyalty programs that reward customers for purchases, social
  sharing, referrals, and other engagement across web, mobile, email, and social
  channels, with points redeemable for rewards. CrowdTwist exposed a REST API
  for managing members, tracking earning and redemption activities, and
  administering points, tiers, and campaigns. Oracle acquired CrowdTwist in
  March 2019 and folded it into Oracle CX Marketing as Oracle CrowdTwist Loyalty
  and Engagement; the standalone crowdtwist.com site now redirects to Oracle and
  the developer documentation is hosted on Oracle Help Center.
