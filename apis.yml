apis:
- aid: crowdtwist-loyalty
  name: Oracle CrowdTwist Loyalty and Engagement API
  description: >-
    The core CrowdTwist REST/JSON API for loyalty program members and their points economy —
    create, read, update and delete members; award points for activities; read the activity,
    reward and badge catalogues; redeem rewards; read redemption history, usable coupons,
    points expiration and the leaderboard. Authentication is a per-client API key sent either
    as an api_key query parameter or an X-CT-Authorization header, with optional HMAC-SHA-256
    request signing. Versioning is per resource: /v2, /v2.1 and /v2.2 are all current at once,
    and superseded revisions stay online labelled "(legacy)". The host is templated per
    customer — {client_id} is a CrowdTwist-issued number and the environment prefix selects
    production, sandbox or a regional instance.
  humanURL: https://docs.oracle.com/en/cloud/saas/marketing/crowdtwist-develop/GettingStarted.html
  baseURL: https://api{client_id}.crowdtwist.com/v2
  tags:
  - Loyalty
  - Members
  - Rewards
  - Points
  - Activities
  properties:
  - type: Documentation
    url: https://docs.oracle.com/en/cloud/saas/marketing/crowdtwist-develop/GettingStarted.html
  - type: Postman
    url: postman/crowdtwist-starter-kit.postman_collection.json
  - type: Authentication
    url: authentication/crowdtwist-authentication.yml
- aid: crowdtwist-commerce
  name: Oracle CrowdTwist Commerce (POS) API
  description: >-
    The point-of-sale side of CrowdTwist, served from a separate templated host. Purchase posts
    a receipt with line items, tenders and coupons and returns the per-item point breakdown
    including bonus-campaign multipliers; Fulfillment marks a redemption shipped; Return
    reverses points for a returned purchase. Authentication is the client API key in an
    X-CT-Authorization header — HMAC signing is explicitly NOT supported on this host. The
    receipt_id field is documented as a unique identifier per request and duplicates are
    rejected, which makes Purchase the only de-duplicated write in the platform.
  humanURL: https://docs.oracle.com/en/cloud/saas/marketing/crowdtwist-develop/Developers/Purchase.html
  baseURL: https://pos{client_id}.crowdtwist.com
  tags:
  - Commerce
  - Point-of-Sale
  - Receipts
  - Fulfillment
  tags_raw:
