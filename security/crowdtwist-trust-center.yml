api: Oracle CrowdTwist Loyalty and Engagement
summary: >-
  There is no CrowdTwist trust center. The trust surface for this product is Oracle's corporate
  Cloud Compliance program, which is the correct owner under the parent-brand rule — Oracle
  acquired CrowdTwist in March 2019, sells it as an Oracle Cloud Service under the Oracle Cloud
  Hosting and Delivery Policies, and the Service Descriptions document explicitly subjects a
  CrowdTwist order to "the Oracle Cloud Hosting and Delivery Policies and the Oracle SaaS Public
  Cloud Services pillar documentation".
trust_center:
  published: true
  owner: Oracle Corporation (parent)
  url: https://www.oracle.com/corporate/cloud-compliance/
  http_status: 200
